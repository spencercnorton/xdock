name: Bug report
description: The dock or the launcher misbehaves, shows the wrong thing, or leaves something behind after disabling.
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove machine names, user names and personal paths from anything you paste.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what happened instead.
      placeholder: After dragging an app onto a drawer in the launcher, the drawer stayed empty.
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: Output of `gnome-shell --version` and `gnome-extensions info xdock@spencercnorton.github.io`, and the number of monitors.
      render: text
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      description: The relevant lines from `journalctl --user -b | grep -i xdock`, scrubbed.
      render: text
