name: Feature request
description: Suggest a change to the dock or the launcher.
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and why the extension gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you propose
